<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>KuroCat 铃铛小黑 · 2D 预览</title><meta name="viewport" content="width=880"><style>
html,body{margin:0;background:#fff;font:12px/1.45 -apple-system,"PingFang SC",sans-serif;color:#222}
#c{display:block;width:840px;height:880px;cursor:grab}
#c.dragging{cursor:grabbing}
#panel{position:fixed;left:12px;top:12px;width:212px;padding:10px 12px 11px;border-radius:10px;
  background:rgba(255,255,255,.93);box-shadow:0 2px 14px rgba(0,0,0,.15);user-select:none}
#panel h3{margin:0 0 9px;font-size:12px;letter-spacing:.04em;color:#666;font-weight:600}
.row{margin:0 0 9px}
.row label{display:flex;justify-content:space-between;gap:8px;color:#333}
.row label b{color:#a06a12;font-weight:600}
.row input[type=range]{width:100%;margin:4px 0 0;accent-color:#c78a20}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:inherit;padding:5px 6px;border:1px solid #d8d8d8;border-radius:6px;background:#fafafa;cursor:pointer}
button:hover{background:#f0f0f0}
button.on{background:#fbf0d8;border-color:#e0bd7a;color:#8a5b00}
.hint{margin:9px 0 0;color:#8a8a8a;line-height:1.5}
</style>  <script type="module" crossorigin src="./assets/index-BMeH7hTH.js"></script>
</head><body>
<canvas id="c"></canvas>
<div id="panel">
  <h3>KuroCat 预览控制台</h3>
  <div class="row"><label>头部倾斜 <b id="tiltVal">自动</b></label>
    <input id="tilt" type="range" min="-0.45" max="0.45" step="0.01" value="0"></div>
  <div class="row"><label>横向扭头 <b id="turnVal">自动</b></label>
    <input id="turn" type="range" min="-10" max="10" step="0.5" value="0"></div>
  <div class="btns">
    <button id="auto">恢复自动</button>
    <button id="reset">归零视角</button>
    <button id="music">音乐 OFF</button>
    <button id="press">按住鼠标</button>
  </div>
  <div class="hint">在猫咪身上按住拖动：左右拖＝扭头，上下拖＝歪头；空格＝归零</div>
</div></body></html>
